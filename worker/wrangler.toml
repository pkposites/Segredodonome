# Cloudflare Worker do Segredo do Nome. Nada aqui é segredo: os segredos vão por
# `wrangler secret put NOME --env <ambiente>` (lista em .dev.vars.example).
name = "segredo-do-nome"
main = "src/index.ts"
compatibility_date = "2026-10-01"

[triggers]
# 03:00 em America/Sao_Paulo (UTC-3, sem horário de verão) = 06:00 UTC
crons = ["0 6 * * *"]

# ---------- desenvolvimento ----------
[env.dev]
name = "segredo-do-nome-dev"
vars = { PUBLIC_BASE_URL = "http://localhost:8788", PIX_VALIDADE_MINUTOS = "30", META_GRAPH_VERSION = "v26.0" }

[[env.dev.d1_databases]]
binding = "DB"
database_name = "segredo-do-nome"
database_id = "PREENCHER_DEPOIS_DE_CRIAR_O_D1"
migrations_dir = "migrations"

[[env.dev.ratelimits]]
name = "LIMITE"
namespace_id = "1001"
simple = { limit = 60, period = 60 }

[env.dev.triggers]
crons = ["0 6 * * *"]

# ---------- produção ----------
[env.production]
name = "segredo-do-nome"
vars = { AMBIENTE = "production", PUBLIC_BASE_URL = "https://segredo.relatoriorda.com.br", PIX_VALIDADE_MINUTOS = "30", META_GRAPH_VERSION = "v26.0", META_PIXEL_ID = "2132885950950048" }
# O Worker responde no subdomínio próprio (o domínio relatoriorda.com.br precisa estar na mesma conta Cloudflare).
# Um nível só de subdomínio: o certificado gratuito da Cloudflare não cobre api.segredo.relatoriorda.com.br.
routes = [{ pattern = "segredo-api.relatoriorda.com.br", custom_domain = true }]

[[env.production.d1_databases]]
binding = "DB"
database_name = "segredo-do-nome-prod"
database_id = "PREENCHER_DEPOIS_DE_CRIAR_O_D1"
migrations_dir = "migrations"

[[env.production.ratelimits]]
name = "LIMITE"
namespace_id = "1002"
simple = { limit = 60, period = 60 }

[env.production.triggers]
crons = ["0 6 * * *"]
