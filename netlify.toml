# Dois sites no Netlify a partir deste repositório (worker/scripts/montar-netlify.mjs):
#  - segredo-do-nome-previa: web/ + modo demonstração (?demo=1). O pacote da demonstração
#    contém os textos pagos e nunca vai para o site oficial.
#  - site oficial (segredo.relatoriorda.com.br): só web/.
[build]
  command = "cd worker && npm ci && node scripts/montar-netlify.mjs"
  publish = "publicar"
